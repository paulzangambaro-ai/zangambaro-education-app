name: Build Zangambaro Education APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          set -e

          rm -rf android-build

          mkdir -p android-build/app/src/main/java/com/zangambaro/education
          mkdir -p android-build/app/src/main/res/drawable
          mkdir -p android-build/app/src/main/res/values
          mkdir -p android-build/app/src/main/assets

          cp MainActivity.java \
            android-build/app/src/main/java/com/zangambaro/education/MainActivity.java

          cp AndroidManifest.xml \
            android-build/app/src/main/AndroidManifest.xml

          cp styles.xml \
            android-build/app/src/main/res/values/styles.xml

          cp app_icon.xml \
            android-build/app/src/main/res/drawable/app_icon.xml

          cp index.html \
            android-build/app/src/main/assets/index.html

          if [ -f teacher-cover.png ]; then
            cp teacher-cover.png android-build/app/src/main/assets/teacher-cover.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png android-build/app/src/main/assets/icon-512.png
          fi

          cat > android-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZangambaroEducation"
          include(":app")
          EOF

          cat > android-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.2' apply false
          }
          EOF

          cat > android-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zangambaro.education'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zangambaro.education'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          echo "===== CREATED PROJECT ====="
          find android-build -maxdepth 8 -type f | sort

      - name: Create Gradle wrapper
        working-directory: android-build
        run: |
          gradle wrapper --gradle-version 8.11.1

      - name: Build APK
        working-directory: android-build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Show APK
        run: |
          echo "===== APK ====="
          find android-build -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zangambaro-Education-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
